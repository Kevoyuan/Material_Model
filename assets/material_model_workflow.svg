<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Material_Model research workflow</title>
  <desc id="desc">Overview of a master's thesis workflow for sheet-material anisotropy characterization using an innovative specimen geometry, inverse analysis, LS-DYNA, YLD2000-2d and machine learning.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #111827; }
      .subtitle { font: 400 18px Arial, Helvetica, sans-serif; fill: #4b5563; }
      .section { font: 700 24px Arial, Helvetica, sans-serif; fill: #111827; }
      .label { font: 600 17px Arial, Helvetica, sans-serif; fill: #1f2937; }
      .small { font: 400 15px Arial, Helvetica, sans-serif; fill: #4b5563; }
      .tiny { font: 400 13px Arial, Helvetica, sans-serif; fill: #6b7280; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 14; }
      .lane { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .accent { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; rx: 14; }
      .arrow { fill: none; stroke: #2563eb; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="70" y="62" class="title">Material_Model - Research Workflow</text>
  <text x="70" y="94" class="subtitle">Master's Thesis: Characterization of the Anisotropy of Sheet Materials using an Innovative Specimen Geometry</text>

  <rect x="70" y="130" width="1260" height="220" class="lane"/>
  <text x="95" y="165" class="section">Research context</text>

  <g transform="translate(130 180)">
    <line x1="0" y1="80" x2="190" y2="80" stroke="#94a3b8" stroke-width="2"/>
    <line x1="95" y1="0" x2="95" y2="160" stroke="#94a3b8" stroke-width="2"/>
    <ellipse cx="95" cy="80" rx="70" ry="50" fill="none" stroke="#111827" stroke-width="3" transform="rotate(-22 95 80)"/>
    <circle cx="52" cy="43" r="10" fill="#3b82f6" fill-opacity="0.22" stroke="#2563eb" stroke-width="3"/>
    <circle cx="142" cy="48" r="10" fill="#ef4444" fill-opacity="0.18" stroke="#dc2626" stroke-width="3"/>
    <circle cx="151" cy="99" r="10" fill="#22c55e" fill-opacity="0.18" stroke="#16a34a" stroke-width="3"/>
    <text x="6" y="132" class="small">YLD2000-2d yield surface</text>
  </g>

  <g transform="translate(485 180) scale(0.78)">
    <path d="M70 10 H210 V58 L170 98 L210 138 V186 H70 V138 L110 98 L70 58 Z" fill="#e11d48" opacity="0.92"/>
    <path d="M112 60 H168 L145 83 H135 Z" fill="#ffffff"/>
    <path d="M135 113 H145 L168 136 H112 Z" fill="#ffffff"/>
    <line x1="20" y1="98" x2="260" y2="98" stroke="#111827" stroke-width="3" stroke-dasharray="10 8"/>
    <text x="38" y="210" class="small">Innovative biaxial specimen</text>
  </g>

  <rect x="800" y="185" width="470" height="125" class="accent"/>
  <text x="825" y="220" class="label">YLD2000-2d parameter set</text>
  <text x="825" y="252" class="small">sigma45, sigma90, sigmab, r0, r45, r90, rb, M</text>
  <text x="825" y="282" class="tiny">Goal: identify anisotropic material behavior from experimental and simulated responses.</text>

  <rect x="70" y="390" width="1260" height="205" class="lane"/>
  <text x="95" y="427" class="section">Inverse Analysis</text>

  <rect x="100" y="465" width="180" height="82" class="box"/>
  <text x="190" y="495" text-anchor="middle" class="label">Experiment</text>
  <text x="190" y="522" text-anchor="middle" class="small">strain field / profile</text>
  <path d="M280 506 H345" class="arrow"/>
  <rect x="350" y="465" width="180" height="82" class="box"/>
  <text x="440" y="495" text-anchor="middle" class="label">FEM</text>
  <text x="440" y="522" text-anchor="middle" class="small">LS-DYNA</text>
  <path d="M530 506 H595" class="arrow"/>
  <rect x="600" y="465" width="210" height="82" class="box"/>
  <text x="705" y="495" text-anchor="middle" class="label">Error evaluation</text>
  <text x="705" y="522" text-anchor="middle" class="small">experiment vs. FEM</text>
  <path d="M810 506 H875" class="arrow"/>
  <rect x="880" y="465" width="170" height="82" class="accent"/>
  <text x="965" y="495" text-anchor="middle" class="label">LS-OPT</text>
  <text x="965" y="522" text-anchor="middle" class="small">minimize error</text>
  <path d="M1050 506 H1115" class="arrow"/>
  <rect x="1120" y="465" width="170" height="82" class="box"/>
  <text x="1205" y="495" text-anchor="middle" class="label">Calibrated</text>
  <text x="1205" y="522" text-anchor="middle" class="small">material model</text>

  <rect x="70" y="625" width="1260" height="205" class="lane"/>
  <text x="95" y="662" class="section">Machine Learning</text>

  <rect x="100" y="700" width="180" height="82" class="box"/>
  <text x="190" y="730" text-anchor="middle" class="label">Random parameters</text>
  <text x="190" y="757" text-anchor="middle" class="small">YLD2000-2d samples</text>
  <path d="M280 741 H345" class="arrow"/>
  <rect x="350" y="700" width="180" height="82" class="box"/>
  <text x="440" y="730" text-anchor="middle" class="label">FEM dataset</text>
  <text x="440" y="757" text-anchor="middle" class="small">LS-DYNA simulations</text>
  <path d="M530 741 H595" class="arrow"/>
  <rect x="600" y="700" width="190" height="82" class="box"/>
  <text x="695" y="730" text-anchor="middle" class="label">Strain features</text>
  <text x="695" y="757" text-anchor="middle" class="small">x / y strain response</text>
  <path d="M790 741 H855" class="arrow"/>
  <rect x="860" y="700" width="190" height="82" class="accent"/>
  <text x="955" y="730" text-anchor="middle" class="label">Neural network</text>
  <text x="955" y="757" text-anchor="middle" class="small">parameter inference</text>
  <path d="M1050 741 H1115" class="arrow"/>
  <rect x="1120" y="700" width="170" height="82" class="box"/>
  <text x="1205" y="730" text-anchor="middle" class="label">Predicted</text>
  <text x="1205" y="757" text-anchor="middle" class="small">YLD parameters</text>

  <text x="70" y="870" class="tiny">Concept adapted from the thesis overview supplied with this repository documentation.</text>
</svg>
